:root {

.skeleton {

}
@keyframes shimmer {

  100% { background-position: -200% 0; }
}

.alert-pulse {

}
@keyframes alertPulse {

/* Gradient text */
.text-gradient {
  background: linear-gradient(135deg, #1a7ff5, #0d9488);
  -webkit-background-clip: text;

  background-clip: text;
}

/* Medical illustration decorative circles */
.decor-circle {

/* Button press */
.btn-press:active {

/* Focus ring */
.focus-brand:focus-visible {
