/* Custom styles beyond Tailwind */
:root {

/* Smooth theme transition */
html {

::-webkit-scrollbar {

/* Card hover lift */
.card-interactive {

}
.card-interactive:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 40px -12px rgba(0,0,0,0.12);
}

/* Progress ring */
.progress-ring {
  transition: stroke-dashoffset 0.5s ease;
}

/* Question transition */
.question-enter {
  animation: slideUp 0.4s cubic-bezier(0.16,1,0.3,1);
}

/* Skeleton */
.skeleton {

  animation: shimmer 1.5s infinite;
}
.dark .skeleton {
  background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
  background-size: 200% 100%;
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* Alert banner pulse */
.alert-pulse {

}
@keyframes alertPulse {

/* Gradient text */
.text-gradient {
  background: linear-gradient(135deg, #1a7ff5, #0d9488);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* Medical illustration decorative circles */
.decor-circle {
  position: absolute;
  border-radius: 50%;

/* Button press */
.btn-press:active {

}

/* Focus ring */
.focus-brand:focus-visible {

/* Hide scrollbar utility */

.float-icon {

  <script>
    // Fallback: never stay on splash longer than 4s even if scripts fail
    setTimeout(function () {
      var s = document.getElementById("splash");
      var a = document.getElementById("app");
      if (s && s.parentNode) {
        s.style.opacity = "0";
        s.style.transition = "opacity 0.4s";
        setTimeout(function () { try { s.remove(); } catch (e) {} }, 500);
      }
      if (a) a.style.opacity = "1";
    }, 4000);

<script>
/**
 * SymptoAI Auth – client-side with Web Crypto (SHA-256 + salt)
 * W produkcji: prawdziwy backend + bcrypt/argon2 + JWT + HTTPS.
 */

const AUTH_STORAGE_KEY = "symptoai_users_v1";
const SESSION_KEY = "symptoai_session_v1";
const HISTORY_PREFIX = "symptoai_history_";

async function sha256(message) {
  const msgBuffer = new TextEncoder().encode(message);
  const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
}

function generateSalt(length = 16) {
  const array = new Uint8Array(length);
  crypto.getRandomValues(array);
  return Array.from(array, b => b.toString(16).padStart(2, "0")).join("");
}

function getUsers() {
  try {
    return JSON.parse(localStorage.getItem(AUTH_STORAGE_KEY) || "{}");
  } catch {
    return {};
  }
}

function saveUsers(users) {
  localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(users));
}

async function registerUser({ email, password, username }) {
  const users = getUsers();
  const normalizedEmail = email.trim().toLowerCase();

  if (!normalizedEmail || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(normalizedEmail)) {
    throw new Error("Podaj prawidłowy adres e-mail.");
  }
  if (!username || username.trim().length < 3) {
    throw new Error("Nazwa użytkownika musi mieć co najmniej 3 znaki.");
  }
  if (!password || password.length < 8) {
    throw new Error("Hasło musi mieć minimum 8 znaków.");
  }
  if (!/[A-Za-z]/.test(password) || !/[0-9]/.test(password)) {
    throw new Error("Hasło musi zawierać litery i cyfry.");
  }
  if (users[normalizedEmail]) {
    throw new Error("Konto z tym adresem e-mail już istnieje.");
  }

  const salt = generateSalt();
  const hash = await sha256(password + salt);

  users[normalizedEmail] = {
    email: normalizedEmail,
    username: username.trim(),
    salt,
    hash,
    createdAt: new Date().toISOString(),
    settings: {
      theme: "system",
      language: "pl"
    }
  };
  saveUsers(users);
  return { email: normalizedEmail, username: username.trim() };
}

async function loginUser(email, password) {
  const users = getUsers();
  const normalizedEmail = email.trim().toLowerCase();
  const user = users[normalizedEmail];
  if (!user) throw new Error("Nieprawidłowy e-mail lub hasło.");

  const hash = await sha256(password + user.salt);
  if (hash !== user.hash) throw new Error("Nieprawidłowy e-mail lub hasło.");

  const session = {
    email: user.email,
    username: user.username,
    loggedInAt: new Date().toISOString()
  };
  localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  return session;
}

function getSession() {
  try {
    return JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
  } catch {
    return null;
  }
}

function logout() {
  localStorage.removeItem(SESSION_KEY);
}

async function changePassword(email, oldPassword, newPassword) {
  const users = getUsers();
  const user = users[email];
  if (!user) throw new Error("Użytkownik nie istnieje.");

  const oldHash = await sha256(oldPassword + user.salt);
  if (oldHash !== user.hash) throw new Error("Obecne hasło jest nieprawidłowe.");

  if (newPassword.length < 8 || !/[A-Za-z]/.test(newPassword) || !/[0-9]/.test(newPassword)) {
    throw new Error("Nowe hasło musi mieć min. 8 znaków, litery i cyfry.");
  }

  const salt = generateSalt();
  const hash = await sha256(newPassword + salt);
  user.salt = salt;
  user.hash = hash;
  saveUsers(users);
}

function deleteAccount(email) {
  const users = getUsers();
  delete users[email];
  saveUsers(users);
  localStorage.removeItem(SESSION_KEY);
  localStorage.removeItem(HISTORY_PREFIX + email);
}

function getUserSettings(email) {
  const users = getUsers();
  return users[email]?.settings || { theme: "system", language: "pl" };
}

function updateUserSettings(email, settings) {
  const users = getUsers();
  if (users[email]) {
    users[email].settings = { ...users[email].settings, ...settings };
    saveUsers(users);
  }
}

/* History */
function getHistory(email) {
  try {
    return JSON.parse(localStorage.getItem(HISTORY_PREFIX + email) || "[]");
  } catch {
    return [];
  }
}

function saveAnalysis(email, analysis) {
  const history = getHistory(email);
  history.unshift({
    id: crypto.randomUUID(),
    createdAt: new Date().toISOString(),
    ...analysis
  });
  // keep last 50
  if (history.length > 50) history.length = 50;
  localStorage.setItem(HISTORY_PREFIX + email, JSON.stringify(history));
  return history[0];
}

function deleteAnalysis(email, id) {
  let history = getHistory(email);
  history = history.filter(h => h.id !== id);
  localStorage.setItem(HISTORY_PREFIX + email, JSON.stringify(history));
}

function clearHistory(email) {
  localStorage.removeItem(HISTORY_PREFIX + email);
}

<script>
/**
 * SymptoAI Analysis Engine
 * Scoring based on symptom matching. Never claims certainty.
 */

function analyzeAnswers(answers) {
  const symptoms = extractSymptoms(answers);
  const scores = DISEASES.map(disease => {
    let score = 0;
    let matched = [];
    let missing = [];
    let againstHits = [];

    disease.typical.forEach(s => {
      if (symptoms.has(s)) {
        score += 3;
        matched.push(s);
      } else {
        missing.push(s);
      }
    });
    disease.lessTypical.forEach(s => {
      if (symptoms.has(s)) {
        score += 1.5;
        matched.push(s);
      }
    });
    disease.against.forEach(s => {
      if (symptoms.has(s)) {
        score -= 2;
        againstHits.push(s);
      }
    });
    disease.factors.forEach(f => {
      if (symptoms.has(f) || answers[f]) score += 0.8;
    });

    // age / sex simple modifiers (very rough)
    if (disease.id === "uti" && answers.sex === "female") score += 1.5;
    if (disease.id === "migraine" && answers.sex === "female") score += 0.5;

    return {
      disease,
      score: Math.max(0, score),
      matched,
      missing,
      againstHits
    };
  });

  scores.sort((a, b) => b.score - a.score);

  const top = scores.filter(s => s.score > 2).slice(0, 4);
  const primary = top[0] || null;
  const others = top.slice(1);

  // Red flags detection
  const redFlags = detectRedFlags(answers, symptoms);

  return {
    primary,
    others,
    allScores: scores,
    redFlags,
    symptoms: Array.from(symptoms),
    answers,
    disclaimer: "Wynik ma charakter wyłącznie orientacyjny i nie stanowi diagnozy medycznej. Tylko lekarz może postawić rozpoznanie po badaniu."
  };
}

function extractSymptoms(answers) {
  const set = new Set();

  if (answers.cough_type === "dry") set.add("kaszel_suchy");
  if (answers.cough_type === "wet" || answers.cough_type === "both") set.add("kaszel_mokry");
  if (answers.sputum === true) set.add("wydzielina");
  if (answers.sputum_color === "bloody") set.add("krwioplucie");
  if (answers.sputum_color === "yellow") set.add("wydzielina_ropna");
  if (answers.cough_pain === true) set.add("bol_przy_kaszu");
  if (answers.dyspnea && answers.dyspnea !== "no") set.add("duszno");
  if (answers.dyspnea === "severe") set.add("duszno_silna");
  if (answers.wheeze === true) set.add("swiszczacy_oddech");
  if (answers.sore_throat === true) set.add("bol_gardla");
  if (answers.runny_nose === true) {
    set.add("katar");
    set.add("zatkany_nos");
  }
  if (answers.fever === true) set.add("lekka_goraczka");
  if (answers.fever_max === "38-39" || answers.fever_max === "39-40" || answers.fever_max === ">40") {
    set.add("wysoka_goraczka");
  }
  if (answers.chills === "chills" || answers.chills === "both") set.add("dreszcze");
  if (answers.malaise === true) set.add("oslabienie");
  if (answers.myalgia === true) {
    set.add("bol_miesni");
    set.add("bol_stawow");
  }
  if (answers.headache === true) set.add("bol_glowy");
  if (answers.headache_type === "pressure") set.add("ucisk_na_skronie");
  if (answers.headache_type === "throbbing") set.add("bol_glowy_jednostronny");
  if (answers.headache_type === "sudden_severe") set.add("nagly_silny_bol");
  if (answers.headache_severity >= 7) set.add("silny_bol_glowy");

  if (Array.isArray(answers.gi_list)) {
    answers.gi_list.forEach(g => {
      if (g === "nausea") set.add("nudnosci");
      if (g === "vomiting") set.add("wymioty");
      if (g === "diarrhea") set.add("biegunka");
      if (g === "constipation") set.add("zaparcia");
      if (g === "abdominal_pain") set.add("bol_brzucha");
      if (g === "heartburn") {
        set.add("zgaga");
        set.add("uczucie_pieczenia");
      }
      if (g === "loss_appetite") set.add("brak_apetytu");
    });
  }

  if (answers.chest_pain === true) set.add("bol_klatki");
  if (answers.chest_type === "pressure" || answers.chest_type === "tightness") set.add("ucisk_w_klatce");
  if (answers.chest_radiation === true) set.add("promieniowanie_bolu");
  if (answers.palpitations === true) set.add("kołatanie");

  if (Array.isArray(answers.skin_list)) {
    answers.skin_list.forEach(s => {
      if (s === "rash") set.add("wysypka");
      if (s === "itch") set.add("swiad");
      if (s === "redness") set.add("zaczerwienienie");
      if (s === "swelling") set.add("obrzęk");
      if (s === "blisters") set.add("pecherzyki");
    });
  }

  if (Array.isArray(answers.neuro_list)) {
    answers.neuro_list.forEach(n => {
      if (n === "dizziness") set.add("zawroty");
      if (n === "balance") set.add("problemy_z_równowaga");
      if (n === "numbness") set.add("drętwienie");
      if (n === "weakness_side") set.add("oslabienie_jednej_strony");
      if (n === "speech") set.add("problemy_z_mowa");
      if (n === "vision") set.add("problemy_z_widzeniem");
      if (n === "fainting") set.add("omdlenie");
    });
  }

  if (answers.contact_sick === true) set.add("kontakt_z_chorym");
  if (answers.animals === true) set.add("kontakt_ze_zwierzetami");
  if (answers.allergies === true) set.add("alergie");
  if (answers.travel === true) set.add("podroz");
  if (answers.injury === "exercise") set.add("intensywny_wysiłek");
  if (answers.injury === "injury") set.add("uraz");
  if (answers.injury === "surgery") set.add("zabieg");

  // main symptom helpers
  if (answers.main_symptom === "cough") set.add("kaszel");
  if (answers.main_symptom === "fever") set.add("goraczka");
  if (answers.main_symptom === "breathing") set.add("duszno");

  return set;
}

function detectRedFlags(answers, symptoms) {
  const flags = [];

  if (answers.dyspnea === "severe" || symptoms.has("duszno_silna")) {
    flags.push({
      severity: "critical",
      title: "Silna duszność",
      message: "Silne trudności z oddychaniem mogą wskazywać na stan wymagający natychmiastowej pomocy medycznej. Rozważ wezwanie pogotowia (112) lub udaj się do SOR."
    });
  }
  if (answers.headache_type === "sudden_severe" || symptoms.has("nagly_silny_bol")) {
    flags.push({
      severity: "critical",
      title: "Nagły, bardzo silny ból głowy",
      message: "Nagły, ekstremalnie silny ból głowy („najgorszy w życiu”) wymaga natychmiastowej oceny medycznej."
    });
  }
  if (answers.chest_pain === true && (answers.chest_type === "pressure" || answers.chest_radiation === true)) {
    flags.push({
      severity: "high",
      title: "Ból / ucisk w klatce piersiowej",
      message: "Ból lub ucisk w klatce piersiowej, szczególnie z promieniowaniem, dusznością lub kołataniem, może wymagać pilnej konsultacji. W razie nasilenia – wezwij pomoc."
    });
  }
  if (Array.isArray(answers.neuro_list) && (
    answers.neuro_list.includes("weakness_side") ||
    answers.neuro_list.includes("speech") ||
    answers.neuro_list.includes("fainting")
  )) {
    flags.push({
      severity: "critical",
      title: "Objawy neurologiczne",
      message: "Nagłe osłabienie jednej strony ciała, zaburzenia mowy lub utrata przytomności to objawy alarmowe – natychmiast wezwij pogotowie (112)."
    });
  }
  if (answers.sputum_color === "bloody") {
    flags.push({
      severity: "high",
      title: "Odkrztuszanie krwi",
      message: "Obecność krwi w plwocinie wymaga oceny lekarskiej w krótkim czasie."
    });
  }
  if (Array.isArray(answers.skin_list) && answers.skin_list.includes("swelling") && answers.dyspnea && answers.dyspnea !== "no") {
    flags.push({
      severity: "critical",
      title: "Możliwa ciężka reakcja alergiczna",
      message: "Obrzęk + duszność mogą wskazywać na reakcję anafilaktyczną. Wezwij natychmiastową pomoc."
    });
  }

  return flags;
}

/** Get next question id based on current answers */
function getNextQuestionId(currentId, answers) {
  const node = QUESTION_TREE[currentId];
  if (!node) return "end";

  if (currentId === "main_symptom") {
    const branch = MAIN_TO_BRANCH[answers.main_symptom] || "fever_check";
    return branch;
  }

  if (node.type === "yesno") {
    if (answers[node.field] === true && node.nextYes) return node.nextYes;
    if (answers[node.field] === false && node.nextNo) return node.nextNo;
  }

  return node.next || "end";
}

function shouldSkipQuestion(qid, answers) {
  // Simple skip logic – can be extended
  if (qid === "cough_type" && answers.main_symptom !== "cough" && answers.main_symptom !== "breathing" && answers.main_symptom !== "other") {
    // still allow if user later reports cough, but for now follow branch
  }
  return false;
}

/**
 * SymptoAI UI helpers – rendering, toasts, modals, theme
 */

function $(sel, root = document) { return root.querySelector(sel); }
function $$(sel, root = document) { return [...root.querySelectorAll(sel)]; }

function toast(message, type = "info", duration = 3500) {
  const container = $("#toast-container");
  const el = document.createElement("div");
  const colors = {
    info: "bg-slate-800 text-white",
    success: "bg-emerald-600 text-white",
    error: "bg-red-600 text-white",
    warn: "bg-amber-500 text-white"
  };
  el.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-card text-sm font-medium ${colors[type] || colors.info} animate-slide-up max-w-sm`;
  el.textContent = message;
  container.appendChild(el);
  setTimeout(() => {
    el.style.opacity = "0";
    el.style.transform = "translateY(-8px)";
    el.style.transition = "all 0.3s";
    setTimeout(() => el.remove(), 300);
  }, duration);
}

function applyTheme(theme) {
  const root = document.documentElement;
  if (theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
    root.classList.add("dark");
  } else {
    root.classList.remove("dark");
  }
  localStorage.setItem("symptoai_theme", theme);
}

function initTheme() {
  const saved = localStorage.getItem("symptoai_theme") || "system";
  applyTheme(saved);
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    if ((localStorage.getItem("symptoai_theme") || "system") === "system") applyTheme("system");
  });
}

          <button class="px-4 py-2.5 rounded-xl text-sm font-medium text-white ${danger ? 'bg-red-600 hover:bg-red-700' : 'bg-brand-600 hover:bg-brand-700'} transition btn-press" id="modal-confirm">${confirmText}</button>

}

            <input type="checkbox" value="${o.value}" class="w-5 h-5 rounded accent-brand-600" />
            <span class="font-medium text-sm">${o.label}</span>
          </label>
        `).join("")}
      </div>
      <button id="multi-next" class="mt-5 w-full py-3.5 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white font-semibold transition btn-press">Dalej</button>
    `;
  } else if (node.type === "scale") {
    inputHtml = `
      <div class="mt-8">
        <input type="range" id="scale-input" min="${node.min}" max="${node.max}" value="5" class="w-full accent-brand-600 h-2" />
        <div class="flex justify-between text-xs text-slate-400 mt-2">
          <span>${node.min}</span>
          <span id="scale-val" class="text-2xl font-bold text-brand-600">5</span>
          <span>${node.max}</span>
        </div>
        <button id="scale-next" class="mt-6 w-full py-3.5 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white font-semibold transition btn-press">Dalej</button>
      </div>
    `;
  } else if (node.type === "number") {
    inputHtml = `
      <div class="mt-6">
        <input type="number" id="number-input" min="${node.min || 0}" max="${node.max || 120}" class="w-full px-5 py-4 text-2xl font-bold text-center rounded-2xl border-2 border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:border-brand-500 outline-none" placeholder="np. 32" />
        <button id="number-next" class="mt-5 w-full py-3.5 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white font-semibold transition btn-press">Dalej</button>
      </div>
    `;
  } else if (node.type === "text") {
    inputHtml = `
      <div class="mt-6">
        <textarea id="text-input" rows="3" class="w-full px-4 py-3 rounded-2xl border-2 border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:border-brand-500 outline-none resize-none" placeholder="Opcjonalnie…"></textarea>
        <button id="text-next" class="mt-4 w-full py-3.5 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white font-semibold transition btn-press">Dalej</button>
        <button id="text-skip" class="mt-2 w-full py-2 text-sm text-slate-400">Pomiń</button>
      </div>
    `;
  }

  return `
  <div class="max-w-lg mx-auto animate-slide-up question-enter">
    <div class="mb-6">
      <div class="flex items-center justify-between text-xs text-slate-400 mb-2">
        <span>Pytanie ${progress}</span>
        <span>${pct}%</span>
      </div>
      <div class="h-1.5 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
        <div class="h-full bg-gradient-to-r from-brand-500 to-medical-teal rounded-full transition-all duration-500" style="width:${pct}%"></div>
      </div>
    </div>

    <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-card border border-slate-100 dark:border-slate-800 p-6 sm:p-8">
      <h2 class="font-display text-xl sm:text-2xl font-bold leading-snug mb-1">${node.text}</h2>
      ${inputHtml}
    </div>

    <div class="mt-4 flex justify-between">
      <button id="btn-back" class="text-sm text-slate-400 hover:text-slate-600 flex items-center gap-1 transition ${progress <= 1 ? 'invisible' : ''}">
        ${icon("arrow-left", "w-4 h-4")} Wstecz
      </button>
      <button onclick="cancelAnalysis()" class="text-sm text-slate-400 hover:text-red-500 transition">Anuluj</button>
    </div>
  </div>`;
}

function viewResults(result) {
  const { primary, others, redFlags, disclaimer } = result;

  if (redFlags.length > 0 && redFlags.some(f => f.severity === "critical")) {
    return viewEmergency(redFlags);
  }

  return `
  <div class="max-w-3xl mx-auto animate-fade-in">
    <div class="text-center mb-8">
      <div class="inline-flex w-14 h-14 rounded-2xl bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 items-center justify-center mb-4">${icon("clipboard-check", "w-7 h-7")}</div>
      <h1 class="font-display text-2xl sm:text-3xl font-bold">Wstępna analiza</h1>
      <p class="text-sm text-slate-500 mt-2 max-w-md mx-auto">${disclaimer}</p>
    </div>

    ${redFlags.length > 0 ? `
      <div class="mb-6 p-5 rounded-2xl bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800 alert-pulse">
        <h3 class="font-semibold text-amber-800 dark:text-amber-200 flex items-center gap-2 mb-2">${icon("alert-triangle", "w-5 h-5")} Zwróć uwagę</h3>
        ${redFlags.map(f => `<p class="text-sm text-amber-700 dark:text-amber-300 mb-1"><strong>${f.title}:</strong> ${f.message}</p>`).join("")}
      </div>
    ` : ""}

    ${primary ? `
      <div class="mb-6 p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 shadow-card">
        <p class="text-xs font-semibold uppercase tracking-wider text-brand-600 mb-2">Najbardziej pasująca możliwość</p>
        <h2 class="font-display text-xl font-bold mb-2">${primary.disease.name}</h2>
        <p class="text-sm text-slate-600 dark:text-slate-300 mb-4">${primary.disease.description}</p>
        <p class="text-sm text-slate-500 italic">Na podstawie podanych informacji jedną z możliwych przyczyn jest powyższy stan. Wynik aplikacji nie pozwala potwierdzić rozpoznania.</p>
        
        <div class="mt-5 pt-5 border-t border-slate-100 dark:border-slate-800">
          <button class="accordion-toggle flex items-center justify-between w-full text-left font-medium text-sm" data-target="matched">
            <span>Objawy przemawiające za</span>
            ${icon("chevron-down", "w-4 h-4")}
          </button>
          <div id="matched" class="accordion-content open mt-2">
            <ul class="text-sm text-slate-600 dark:text-slate-300 space-y-1">
              ${primary.matched.length ? primary.matched.map(m => `<li class="flex items-center gap-2">${icon("check", "w-3.5 h-3.5 text-emerald-500")} ${humanSymptom(m)}</li>`).join("") : "<li>Brak silnych dopasowań – wynik orientacyjny.</li>"}
            </ul>
          </div>
        </div>

        ${primary.againstHits.length ? `
        <div class="mt-3">
          <button class="accordion-toggle flex items-center justify-between w-full text-left font-medium text-sm" data-target="against">
            <span>Co mniej pasuje</span>
            ${icon("chevron-down", "w-4 h-4")}
          </button>
          <div id="against" class="accordion-content mt-2">
            <ul class="text-sm text-slate-600 dark:text-slate-300 space-y-1">
              ${primary.againstHits.map(m => `<li class="flex items-center gap-2">${icon("x", "w-3.5 h-3.5 text-red-400")} ${humanSymptom(m)}</li>`).join("")}
            </ul>
          </div>
        </div>
        ` : ""}
      </div>
    ` : `
      <div class="mb-6 p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 shadow-card text-center">
        <p class="text-slate-500">Na podstawie podanych informacji trudno wskazać jedną dominującą możliwość. Objawy mogą pasować do kilku stanów lub wymagać dalszej diagnostyki.</p>
      </div>
    `}

    ${others.length ? `
      <div class="mb-6 p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 shadow-card">
        <h3 class="font-semibold mb-3">Inne możliwe przyczyny</h3>
        <div class="space-y-3">
          ${others.map(o => `
            <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/50">
              <p class="font-medium text-sm">${o.disease.name}</p>
              <p class="text-xs text-slate-500 mt-1">${o.disease.description}</p>
            </div>
          `).join("")}
        </div>
      </div>
    ` : ""}

    <div class="mb-6 p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 shadow-card">
      <h3 class="font-semibold mb-3 flex items-center gap-2">${icon("info", "w-4 h-4")} Czego nie da się ustalić</h3>
      <p class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed">
        Bez badania fizykalnego, badań laboratoryjnych lub obrazowych nie można potwierdzić ani wykluczyć większości chorób.
        Aplikacja nie ocenia wyników badań, nie bada pacjenta i nie zastępuje lekarza.
      </p>
    </div>

    <div class="mb-6 p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 shadow-card">
      <h3 class="font-semibold mb-3 flex items-center gap-2">${icon("arrow-right-circle", "w-4 h-4")} Co dalej?</h3>
      <ul class="text-sm text-slate-600 dark:text-slate-300 space-y-2">
        <li>• Obserwuj objawy i notuj zmiany.</li>
        <li>• Jeśli objawy nasilają się, trwają dłużej niż kilka dni lub pojawiają się nowe – skonsultuj się z lekarzem.</li>
        <li>• W razie duszności, silnego bólu w klatce, nagłego osłabienia, zaburzeń mowy lub utraty przytomności – wezwij pomoc (112).</li>
        ${primary ? `<li>• ${primary.disease.consult}</li>` : ""}
      </ul>
    </div>

    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <button onclick="startAnalysis()" class="px-6 py-3 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white font-semibold transition btn-press">Nowa analiza</button>
      <button onclick="navigate(getSession() ? 'dashboard' : 'welcome')" class="px-6 py-3 rounded-2xl border border-slate-200 dark:border-slate-700 font-medium transition">Wróć</button>
    </div>
  </div>`;
}

function viewEmergency(flags) {
  return `
  <div class="max-w-lg mx-auto text-center animate-slide-up">
    <div class="w-20 h-20 mx-auto rounded-full bg-red-100 dark:bg-red-900/40 text-red-600 flex items-center justify-center mb-6 alert-pulse">
      ${icon("alert-octagon", "w-10 h-10")}
    </div>
    <h1 class="font-display text-2xl font-bold text-red-700 dark:text-red-400 mb-3">Możliwa sytuacja wymagająca pilnej pomocy</h1>
    <p class="text-slate-600 dark:text-slate-300 mb-6">Na podstawie podanych informacji wykryto objawy, które mogą wskazywać na stan wymagający natychmiastowej oceny medycznej.</p>
    
    <div class="space-y-3 mb-8 text-left">
      ${flags.map(f => `
        <div class="p-4 rounded-2xl bg-red-50 dark:bg-red-950/30 border border-red-200 dark:border-red-800">
          <p class="font-semibold text-red-800 dark:text-red-200">${f.title}</p>
          <p class="text-sm text-red-700 dark:text-red-300 mt-1">${f.message}</p>
        </div>
      `).join("")}
    </div>

    <div class="p-5 rounded-2xl bg-slate-100 dark:bg-slate-800 mb-8">
      <p class="font-bold text-lg mb-1">Numer alarmowy: 112</p>
      <p class="text-sm text-slate-500">Lub udaj się do najbliższego Szpitalnego Oddziału Ratunkowego.</p>
    </div>

    <p class="text-xs text-slate-400 mb-6">Aplikacja nie diagnozuje. W sytuacji zagrożenia życia zawsze priorytetem jest profesjonalna pomoc medyczna.</p>
    <button onclick="navigate(getSession() ? 'dashboard' : 'welcome')" class="px-6 py-3 rounded-2xl border border-slate-200 dark:border-slate-700 font-medium">Wróć do aplikacji</button>
  </div>`;
}

function viewHistory(session) {
  const history = getHistory(session.email);
  return `
  <div class="animate-fade-in">
    <h1 class="font-display text-2xl font-bold mb-6">Historia analiz</h1>
    ${history.length === 0 ? `
      <div class="text-center py-16 text-slate-400">
        ${icon("inbox", "w-12 h-12 mx-auto mb-3 opacity-40")}
        <p>Brak zapisanych analiz.</p>
      </div>
    ` : `
      <div class="space-y-3">
        ${history.map(h => `
          <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 shadow-soft flex items-center gap-4">
            <div class="flex-1 min-w-0 cursor-pointer" onclick="openHistoryItem('${h.id}')">
              <p class="font-medium text-sm truncate">${h.summary || "Analiza"}</p>
              <p class="text-xs text-slate-400">${new Date(h.createdAt).toLocaleString("pl-PL")}</p>
            </div>
            <button onclick="confirmDeleteAnalysis('${h.id}')" class="p-2 text-slate-400 hover:text-red-500 transition">${icon("trash-2", "w-4 h-4")}</button>
          </div>
        `).join("")}
      </div>
      <button onclick="confirmClearHistory()" class="mt-6 text-sm text-red-500 hover:underline">Usuń całą historię</button>
    `}
  </div>`;
}

function viewProfile(session) {
  const settings = getUserSettings(session.email);
  return `
  <div class="max-w-lg mx-auto animate-fade-in">
    <h1 class="font-display text-2xl font-bold mb-6">Profil</h1>
    <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-card border border-slate-100 dark:border-slate-800 p-6 space-y-5">
      <div>
        <p class="text-xs text-slate-400 uppercase tracking-wider">Nazwa użytkownika</p>
        <p class="font-semibold">${session.username}</p>
      </div>
      <div>
        <p class="text-xs text-slate-400 uppercase tracking-wider">E-mail</p>
        <p class="font-semibold">${session.email}</p>
      </div>
      <hr class="border-slate-100 dark:border-slate-800" />
      <div>
        <p class="text-sm font-medium mb-2">Motyw</p>
        <div class="flex gap-2">
          ${["light","dark","system"].map(t => `
            <button onclick="setTheme('${t}')" class="px-4 py-2 rounded-xl text-sm font-medium border ${settings.theme === t ? 'border-brand-500 bg-brand-50 dark:bg-brand-950/40 text-brand-700' : 'border-slate-200 dark:border-slate-700'}">${t === "light" ? "Jasny" : t === "dark" ? "Ciemny" : "System"}</button>
          `).join("")}
        </div>
      </div>
      <button onclick="showChangePassword()" class="w-full py-3 rounded-xl border border-slate-200 dark:border-slate-700 font-medium text-sm hover:bg-slate-50 dark:hover:bg-slate-800 transition">Zmień hasło</button>
      <button onclick="logoutAndGo()" class="w-full py-3 rounded-xl border border-slate-200 dark:border-slate-700 font-medium text-sm hover:bg-slate-50 dark:hover:bg-slate-800 transition">Wyloguj się</button>
      <button onclick="confirmDeleteAccount()" class="w-full py-3 rounded-xl text-red-600 font-medium text-sm hover:bg-red-50 dark:hover:bg-red-950/30 transition">Usuń konto</button>
    </div>
    <p class="mt-6 text-xs text-slate-400 text-center">SymptoAI v1.0 • Dane przechowywane lokalnie w przeglądarce</p>
  </div>`;
}

function humanSymptom(code) {
  const map = {
    kaszel_suchy: "suchy kaszel",
    kaszel_mokry: "mokry kaszel",
    wydzielina: "odkrztuszanie wydzieliny",
    duszno: "duszność",
    bol_gardla: "ból gardła",
    katar: "katar",
    zatkany_nos: "zatkany nos",
    lekka_goraczka: "podwyższona temperatura",
    wysoka_goraczka: "wysoka gorączka",
    dreszcze: "dreszcze",
    oslabienie: "osłabienie",
    bol_miesni: "bóle mięśni",
    bol_glowy: "ból głowy",
    nudnosci: "nudności",
    wymioty: "wymioty",
    biegunka: "biegunka",
    zgaga: "zgaga",
    bol_klatki: "ból w klatce piersiowej",
    wysypka: "wysypka",
    swiad: "świąd",
    kontakt_z_chorym: "kontakt z osobą chorą"
  };
  return map[code] || code.replace(/_/g, " ");
}

</script>
<script>
/**
 * SymptoAI – Main application controller
 */

let currentView = "welcome";
let analysisState = null; // { answers, historyStack, currentId, progress }

function navigate(view, data) {
  currentView = view;
  const main = $("#main-content");
  const session = getSession();

  // Auth guards
  if (["dashboard", "history", "profile"].includes(view) && !session) {
    view = "login";
    currentView = "login";
  }

  let html = "";
  switch (view) {
    case "welcome":
      html = viewWelcome();
      break;
    case "login":
      html = viewLogin();
      break;
    case "register":
      html = viewRegister();
      break;
    case "dashboard":
      html = viewDashboard(session);
      break;
    case "history":
      html = viewHistory(session);
      break;
    case "profile":
      html = viewProfile(session);
      break;
    case "question":
      if (!analysisState) { startAnalysis(); return; }
      html = viewQuestion(QUESTION_TREE[analysisState.currentId], analysisState.progress, analysisState.answers);
      break;
    case "results":
      html = viewResults(data || analysisState?.result);
      break;
    default:
      html = viewWelcome();
  }

  main.innerHTML = html;
  renderIcons();
  updateNav();
  bindViewEvents(view);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function updateNav() {
  const session = getSession();
  const desktop = $("#desktop-nav");
  const mobile = $("#mobile-nav-items");
  const actions = $("#header-actions");

  if (!desktop) return;

  if (session) {
    desktop.innerHTML = `
      <button onclick="navigate('dashboard')" class="px-3 py-2 rounded-lg text-sm font-medium ${currentView === 'dashboard' ? 'bg-brand-50 text-brand-700 dark:bg-brand-950/40' : 'text-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800'}">Start</button>
      <button onclick="startAnalysis()" class="px-3 py-2 rounded-lg text-sm font-medium ${currentView === 'question' ? 'bg-brand-50 text-brand-700' : 'text-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800'}">Analiza</button>
      <button onclick="navigate('history')" class="px-3 py-2 rounded-lg text-sm font-medium ${currentView === 'history' ? 'bg-brand-50 text-brand-700' : 'text-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800'}">Historia</button>
      <button onclick="navigate('profile')" class="px-3 py-2 rounded-lg text-sm font-medium ${currentView === 'profile' ? 'bg-brand-50 text-brand-700' : 'text-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800'}">Profil</button>
    `;
    actions.innerHTML = `
      <button onclick="toggleThemeQuick()" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800" title="Motyw">${icon("moon", "w-5 h-5")}</button>
      <span class="text-sm text-slate-500 hidden sm:inline">${session.username}</span>
    `;
    mobile.innerHTML = `
      <button onclick="navigate('dashboard')" class="flex flex-col items-center gap-0.5 text-xs ${currentView === 'dashboard' ? 'text-brand-600' : 'text-slate-400'}">${icon("home", "w-5 h-5")}<span>Start</span></button>
      <button onclick="startAnalysis()" class="flex flex-col items-center gap-0.5 text-xs ${currentView === 'question' ? 'text-brand-600' : 'text-slate-400'}">${icon("stethoscope", "w-5 h-5")}<span>Analiza</span></button>
      <button onclick="navigate('history')" class="flex flex-col items-center gap-0.5 text-xs ${currentView === 'history' ? 'text-brand-600' : 'text-slate-400'}">${icon("history", "w-5 h-5")}<span>Historia</span></button>
      <button onclick="navigate('profile')" class="flex flex-col items-center gap-0.5 text-xs ${currentView === 'profile' ? 'text-brand-600' : 'text-slate-400'}">${icon("user", "w-5 h-5")}<span>Profil</span></button>
    `;
  } else {
    desktop.innerHTML = `
      <button onclick="navigate('welcome')" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">Start</button>
      <button onclick="navigate('login')" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">Logowanie</button>
    `;
    actions.innerHTML = `
      <button onclick="toggleThemeQuick()" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">${icon("moon", "w-5 h-5")}</button>
      <button onclick="navigate('login')" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-sm font-medium">Zaloguj</button>
    `;
    mobile.innerHTML = `
      <button onclick="navigate('welcome')" class="flex flex-col items-center gap-0.5 text-xs ${currentView === 'welcome' ? 'text-brand-600' : 'text-slate-400'}">${icon("home", "w-5 h-5")}<span>Start</span></button>
      <button onclick="startAnalysis()" class="flex flex-col items-center gap-0.5 text-xs text-slate-400">${icon("stethoscope", "w-5 h-5")}<span>Analiza</span></button>
      <button onclick="navigate('login')" class="flex flex-col items-center gap-0.5 text-xs text-slate-400">${icon("log-in", "w-5 h-5")}<span>Konto</span></button>
    `;
  }
  renderIcons();
}

function bindViewEvents(view) {
  if (view === "login") {
    $("#login-form")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        await loginUser(fd.get("email"), fd.get("password"));
        toast("Zalogowano pomyślnie", "success");
        navigate("dashboard");
      } catch (err) {
        toast(err.message, "error");
      }
    });
  }
  if (view === "register") {
    $("#register-form")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      if (fd.get("password") !== fd.get("password2")) {
        toast("Hasła nie są identyczne", "error");
        return;
      }
      try {
        await registerUser({
          email: fd.get("email"),
          password: fd.get("password"),
          username: fd.get("username")
        });
        await loginUser(fd.get("email"), fd.get("password"));
        toast("Konto utworzone", "success");
        navigate("dashboard");
      } catch (err) {
        toast(err.message, "error");
      }
    });
  }
  if (view === "question") {
    bindQuestionEvents();
  }
  if (view === "results") {
    $$(".accordion-toggle").forEach(btn => {
      btn.addEventListener("click", () => {
        const target = $("#" + btn.dataset.target);
        target.classList.toggle("open");
      });
    });
  }
}

function bindQuestionEvents() {
  const node = QUESTION_TREE[analysisState.currentId];

  $$(".answer-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      let val = btn.dataset.val;
      if (val === "true") val = true;
      else if (val === "false") val = false;
      else if (val === "unknown") val = null;
      answerAndNext(node.field, val);
    });
  });

  $("#multi-next")?.addEventListener("click", () => {
    const checked = [...$$("#multi-options input:checked")].map(i => i.value);
    answerAndNext(node.field, checked);
  });

  const scale = $("#scale-input");
  if (scale) {
    scale.addEventListener("input", () => { $("#scale-val").textContent = scale.value; });
    $("#scale-next").addEventListener("click", () => answerAndNext(node.field, +scale.value));
  }

  $("#number-next")?.addEventListener("click", () => {
    const v = +$("#number-input").value;
    if (!v || v < (node.min || 0) || v > (node.max || 120)) {
      toast("Podaj prawidłową wartość", "error");
      return;
    }
    answerAndNext(node.field, v);
  });

  $("#text-next")?.addEventListener("click", () => {
    answerAndNext(node.field, $("#text-input").value.trim() || null);
  });
  $("#text-skip")?.addEventListener("click", () => answerAndNext(node.field, null));

  $("#btn-back")?.addEventListener("click", goBackQuestion);
}

function startAnalysis() {
  analysisState = {
    answers: {},
    historyStack: [],
    currentId: "start",
    progress: 1,
    result: null
  };
  navigate("question");
}

function answerAndNext(field, value) {
  const node = QUESTION_TREE[analysisState.currentId];

  // Red-flag check on the fly
  if (node.redFlag) {
    const trigger = node.redFlag.value !== undefined
      ? (value === node.redFlag.value || (Array.isArray(node.redFlag.values) && node.redFlag.values.includes(value)))
      : value === true;
    if (trigger) {
      analysisState.answers[field] = value;
      const flags = detectRedFlags(analysisState.answers, extractSymptoms(analysisState.answers));
      if (flags.some(f => f.severity === "critical" || f.severity === "high")) {
        analysisState.result = { primary: null, others: [], redFlags: flags, disclaimer: "" };
        navigate("results", analysisState.result);
        return;
      }
    }
  }

  analysisState.answers[field] = value;
  analysisState.historyStack.push({ id: analysisState.currentId, field, value });

  let nextId = getNextQuestionId(analysisState.currentId, analysisState.answers);

  // Skip logic for branches not relevant
  if (nextId === "cough_type" && !["cough", "breathing", "other", "fever"].includes(analysisState.answers.main_symptom)) {
    // still go if main was cough path
  }

  if (nextId === "end" || !QUESTION_TREE[nextId] || nextId === null) {
    finishAnalysis();
    return;
  }

  analysisState.currentId = nextId;
  analysisState.progress += 1;
  navigate("question");
}

function goBackQuestion() {
  if (analysisState.historyStack.length === 0) return;
  const prev = analysisState.historyStack.pop();
  delete analysisState.answers[prev.field];
  analysisState.currentId = prev.id;
  analysisState.progress = Math.max(1, analysisState.progress - 1);
  navigate("question");
}

function cancelAnalysis() {
  showModal({
    title: "Anulować analizę?",
    body: "Postęp zostanie utracony.",
    confirmText: "Anuluj analizę",
    danger: true,
    onConfirm: () => {
      analysisState = null;
      navigate(getSession() ? "dashboard" : "welcome");
    }
  });
}

function finishAnalysis() {
  // Show brief loading
  $("#main-content").innerHTML = `
    <div class="flex flex-col items-center justify-center min-h-[50vh]">
      <div class="w-12 h-12 border-4 border-brand-200 border-t-brand-600 rounded-full animate-spin mb-4"></div>
      <p class="text-slate-500 font-medium">Analizujemy odpowiedzi…</p>
    </div>
  `;

  setTimeout(() => {
    const result = analyzeAnswers(analysisState.answers);
    analysisState.result = result;

    // Build summary
    const main = analysisState.answers.main_symptom || "objawy";
    const summary = primarySummary(result, main);

    const session = getSession();
    if (session) {
      saveAnalysis(session.email, {
        summary,
        answers: analysisState.answers,
        result: {
          primaryName: result.primary?.disease?.name || null,
          others: result.others.map(o => o.disease.name),
          redFlags: result.redFlags
        }
      });
    }

    navigate("results", result);
  }, 900);
}

function primarySummary(result, main) {
  if (result.redFlags.some(f => f.severity === "critical")) return "Objawy alarmowe – pilna ocena";
  if (result.primary) return result.primary.disease.name;
  return "Analiza: " + (main || "ogólna");
}

function openHistoryItem(id) {
  const session = getSession();
  if (!session) return;
  const item = getHistory(session.email).find(h => h.id === id);
  if (!item) return;
  // Reconstruct minimal result for display
  const fakeResult = {
    primary: item.result?.primaryName ? { disease: { name: item.result.primaryName, description: "Zapisana analiza.", consult: "" }, matched: [], againstHits: [] } : null,
    others: (item.result?.others || []).map(n => ({ disease: { name: n, description: "" } })),
    redFlags: item.result?.redFlags || [],
    disclaimer: "To zapis wcześniejszej analizy. Wynik miał charakter orientacyjny."
  };
  navigate("results", fakeResult);
}

      toast("Usunięto", "success");
      navigate("history");
    }
  });
}

function confirmClearHistory() {
  showModal({
    title: "Usunąć całą historię?",
    body: "Wszystkie zapisane analizy zostaną trwale usunięte.",
    confirmText: "Usuń wszystko",
    danger: true,
    onConfirm: () => {
      clearHistory(getSession().email);
      toast("Historia wyczyszczona", "success");
      navigate("history");
    }

}

function showChangePassword() {
  const body = `
    <div class="space-y-3">
      <input type="password" id="old-pass" placeholder="Obecne hasło" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
      <input type="password" id="new-pass" placeholder="Nowe hasło" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />

  `;
  showModal({

    confirmText: "Zmień",

function confirmDeleteAccount() {
  showModal({
    title: "Usunąć konto?",
    body: "Konto i cała historia zostaną trwale usunięte z tej przeglądarki.",
    confirmText: "Usuń konto",
    danger: true,
    onConfirm: () => {
      deleteAccount(getSession().email);
      toast("Konto usunięte", "success");
      navigate("welcome");
    }
  });
}

function logoutAndGo() {
  logout();
  toast("Wylogowano", "info");
  navigate("welcome");
}

function setTheme(t) {
  const session = getSession();
  if (session) updateUserSettings(session.email, { theme: t });
  applyTheme(t);
  navigate("profile");
}

function toggleThemeQuick() {
  const current = localStorage.getItem("symptoai_theme") || "system";
  const next = current === "dark" ? "light" : "dark";
  applyTheme(next);
  const session = getSession();
  if (session) updateUserSettings(session.email, { theme: next });
  updateNav();
}

/* Boot */
function hideSplashAndStart() {
  const splash = document.getElementById("splash");
  const app = document.getElementById("app");
  if (splash) {
    splash.style.opacity = "0";
    splash.style.transition = "opacity 0.4s ease";
    setTimeout(() => {
      try { splash.remove(); } catch (_) {}
    }, 450);
  }
  if (app) {
    app.style.opacity = "1";
  }
  try {
    const session = typeof getSession === "function" ? getSession() : null;
    navigate(session ? "dashboard" : "welcome");
  } catch (err) {
    console.error("Navigate error:", err);
    // Fallback: show welcome HTML directly
    const main = document.getElementById("main-content");
    if (main && typeof viewWelcome === "function") {
      main.innerHTML = viewWelcome();
      if (typeof renderIcons === "function") renderIcons();
    }
  }
}

document.addEventListener("DOMContentLoaded", () => {
  try {
    if (typeof initTheme === "function") initTheme();
  } catch (e) {
    console.warn("Theme init failed", e);
  }

  const bar = document.getElementById("splash-bar");
  let w = 0;
  let finished = false;

  const finish = () => {
    if (finished) return;
    finished = true;
    if (bar) bar.style.width = "100%";
    setTimeout(hideSplashAndStart, 250);
  };

  // Hard timeout – never stay on splash longer than 2.5s
  setTimeout(finish, 2500);

  const interval = setInterval(() => {
    if (finished) {
      clearInterval(interval);
      return;
    }
    w += 18 + Math.random() * 20;
    if (w >= 100) {
      w = 100;
      clearInterval(interval);
      finish();
    }
    if (bar) bar.style.width = Math.min(w, 100) + "%";
  }, 100);
});

// Safety: if DOMContentLoaded already fired or scripts slow
window.addEventListener("load", () => {
  setTimeout(() => {
    const splash = document.getElementById("splash");
    if (splash && splash.parentNode) {
      hideSplashAndStart();
    }
  }, 3000);
});
